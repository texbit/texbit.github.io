  <path
    d="M17.2 18.5
       L18.8 16.8
       L28.9 25.6
       L29.9 25
       L20.9 15.5
       Q19.9 14.4 18.8 15.2
       L16 17.5 Z"
    fill="url(#rear)"/>

  <!-- Main V-shaped TEXBIT symbol -->
  <path
    d="M3.3 8
       L16 18
       L28.7 8
       Q29.5 7.4 30 8.2
       Q30.4 8.9 29.7 9.5
       L17.1 19.8
       Q16 20.7 14.9 19.8
       L2.3 9.5
       Q1.6 8.9 2 8.2
       Q2.5 7.4 3.3 8 Z"
