<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <!-- Silver gradient - na silver din -->
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BEBEBE"/>
      <stop offset="25%" stop-color="#EDEDED"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#C9C9C9"/>
      <stop offset="100%" stop-color="#A9A9A9"/>
    </linearGradient>
    <!-- V gradient - blue -> purple -> cyan -->
    <linearGradient id="vgrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E8FFF"/>
      <stop offset="50%" stop-color="#7A1FF5"/>
      <stop offset="100%" stop-color="#00D4E8"/>
    </linearGradient>
  </defs>

  <!-- Background - baki -->
  <rect x="0" y="0" width="32" height="32" fill="#000000"/>

  <!-- Silver envelope - a tsakiya -->
  <rect x="11" y="12" width="10" height="8" rx="1.2" fill="url(#silver)"/>

  <!-- V - daidai yadda yake -->
  <polyline points="13.2,14.2 16,17.2 18.8,14.2"
    fill="none"
    stroke="url(#vgrad)"
    stroke-width="0.9"
    stroke-linecap="round"
    stroke-linejoin="round"/>
</svg>
