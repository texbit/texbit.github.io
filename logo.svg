<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="32"
     height="32"
     viewBox="0 0 32 32">

  <defs>
    <!-- Main V gradient -->
    <linearGradient id="front"
      x1="3" y1="5" x2="29" y2="15"
      gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#087FE9"/>
      <stop offset="0.48" stop-color="#9020E8"/>
      <stop offset="1" stop-color="#16C9C1"/>
    </linearGradient>

    <!-- Rear crossing lines -->
    <linearGradient id="rear"
      x1="3" y1="20" x2="29" y2="20"
      gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16C9E7"/>
      <stop offset="0.5" stop-color="#278FE9"/>
      <stop offset="1" stop-color="#4659E7"/>
    </linearGradient>
  </defs>

  <!-- Black rounded rectangle -->
  <rect
    x="0.5"
    y="5.5"
    width="31"
    height="21"
    rx="1.8"
    fill="#050505"/>

  <!-- Rear left and right crossing ribbons -->
  <path
    d="M2.1 25
